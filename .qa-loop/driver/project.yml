# QADriver — a scriptable XCUITest that drives the SHIPPED Causeway build on one simulator.
# Regenerate the xcodeproj with `xcodegen generate` in this directory (see start.sh).
name: QADriver
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  QADriver:
    type: bundle.ui-testing
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whimsicaldistractions.qa.QADriver
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  QADriver:
    build:
      targets:
        QADriver: all
    test:
      targets: [QADriver]
